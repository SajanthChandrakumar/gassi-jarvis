name: Dependency security audit
on:
  pull_request:
  push:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Runtime regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_API_KEY: test-only
      NUMBA_CACHE_DIR: ${{ runner.temp }}/numba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: node --check app/static/app.js
      - run: python -m pytest tests -q
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        requirements: [requirements.txt, requirements-cloud.txt, requirements-device.txt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit runtime dependencies
        run: python -m pip_audit --strict -r "${{ matrix.requirements }}" --format json --output dependency-audit.json
      - name: Preserve audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ matrix.requirements }}
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 14
