<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gassi-Jarvis</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #0f0f13; color: white; }
        #micBtn { 
            width: 120px; height: 120px; border-radius: 50%; border: none; 
            background: #2c2c2e; color: white; font-size: 3rem; cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: all 0.3s ease;
        }
        #micBtn.listening { background: #ff453a; box-shadow: 0 0 30px rgba(255, 69, 58, 0.8); transform: scale(1.1); }
        #micBtn.thinking { background: #0a84ff; animation: pulse 1.5s infinite; }
        #status { margin-top: 30px; font-size: 1.2rem; color: #8e8e93; text-align: center; max-width: 80%; }
        
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(10, 132, 255, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(10, 132, 255, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(10, 132, 255, 0); }
        }
    </style>
</head>
<body>
    
    <button id="micBtn" aria-label="Spracheingabe starten" title="Spracheingabe starten">🎙️</button>
    <p id="status" aria-live="polite">Tippen, um zu sprechen</p>

    <script>
        const micBtn = document.getElementById('micBtn');
        const statusText = document.getElementById('status');

        // Web Speech API initialisieren (Chrome & Safari Support)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
            statusText.innerText = "Dein Browser unterstützt keine Spracherkennung. Nutze Chrome oder Safari.";
            micBtn.style.display = 'none';
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.interimResults = false; // Wir wollen nur den fertigen Satz

            // 1. Klick auf den Mikrofon-Button
            micBtn.addEventListener('click', () => {
                recognition.start();
                micBtn.classList.add('listening');
                statusText.innerText = "Ich höre zu...";
            });

            // 2. Sprache wurde erkannt
            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                micBtn.classList.remove('listening');
                micBtn.classList.add('thinking');
                statusText.innerText = `Du: "${transcript}"\nJarvis denkt nach...`;

                try {
                    // Sende den erkannten Text an unser Backend
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            session_id: "voice_walk_01",
                            timestamp: new Date().toISOString(),
                            payload: { type: "text", content: transcript }
                        })
                    });

                    const data = await response.json();
                    statusText.innerText = `Jarvis: "${data.jarvis_response}"`;

                    // Audio abspielen
                    if (data.audio_base64) {
                        const audio = new Audio("data:audio/mp3;base64," + data.audio_base64);
                        audio.play();
                    }
                } catch (error) {
                    statusText.innerText = "Fehler bei der Server-Verbindung.";
                } finally {
                    micBtn.classList.remove('thinking');
                }
            };

            // Falls die Spracherkennung abbricht
            recognition.onspeechend = () => {
                recognition.stop();
            };
            
            recognition.onerror = (event) => {
                micBtn.classList.remove('listening');
                statusText.innerText = `Fehler beim Hören: ${event.error}`;
            };
        }
    </script>
</body>
</html>
